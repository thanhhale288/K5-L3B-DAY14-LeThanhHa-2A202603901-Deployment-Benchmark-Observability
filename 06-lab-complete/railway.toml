# Cấu hình deploy Railway (tiêu chí 12)
# Lưu ý: thêm Redis từ Railway dashboard (New → Database → Redis) rồi đặt biến REDIS_URL
# và AGENT_API_KEY trong tab Variables — không ghi giá trị thật vào file này.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
