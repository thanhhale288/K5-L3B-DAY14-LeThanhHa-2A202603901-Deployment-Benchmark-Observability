# Cấu hình deploy Render (Blueprint) — tiêu chí 12
services:
  - type: web
    name: ai-agent-production
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: AGENT_API_KEY
        generateValue: true          # Render tự sinh, không ghi giá trị vào file
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agent-redis
          property: connectionString

  - type: keyvalue
    name: agent-redis
    plan: free
    ipAllowList: []                  # chỉ cho service nội bộ truy cập
